version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: my-app-mongodb
    restart: unless-stopped
    ports:
      - '27017:27017'
    environment:
      MONGO_INITDB_ROOT_USERNAME: michael
      MONGO_INITDB_ROOT_PASSWORD: 1111
    volumes:
      - mongodb_data:/data/db

volumes:
  mongodb_data:
