services:
  mongodb:
    image: mongo:latest
    container_name: ${MONGO_CONTAINER_NAME:-my-app-mongodb}
    restart: unless-stopped
    ports:
      - '${MONGO_PORT:-27017}:27017'
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-michael}
      # Значение dev-контейнера; для нового окружения задайте MONGO_PASSWORD в .env
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-1111}
    volumes:
      - mongodb_data:/data/db

volumes:
  mongodb_data:
