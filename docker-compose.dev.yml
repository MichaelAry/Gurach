services:
  mongodb:
    image: mongo@sha256:5d7043a4ffe02b9ed1b6e0bab057546981af5ca0a79107e9c461e49bc44c0a7b
    container_name: gurach-dev-mongodb
    restart: unless-stopped
    entrypoint: ["/bin/bash", "/opt/mongo-entrypoint.sh"]
    command: ["mongod", "--bind_ip_all", "--replSet", "rs0"]
    ports:
      - "127.0.0.1:${MONGO_PORT:?Run node scripts/dev-db.mjs up first}:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:?Run node scripts/dev-db.mjs up first}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?Run node scripts/dev-db.mjs up first}
      MONGO_APP_USERNAME: ${MONGO_APP_USERNAME:?Run node scripts/dev-db.mjs up first}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD:?Run node scripts/dev-db.mjs up first}
      MONGO_APP_DATABASE: ${MONGO_APP_DATABASE:?Run node scripts/dev-db.mjs up first}
      MONGO_INITDB_DATABASE: ${MONGO_APP_DATABASE:?Run node scripts/dev-db.mjs up first}
    volumes:
      - gurach_dev_mongodb_data:/data/db
      - ./.local/mongo/keyfile:/run/mongo-keyfile:ro
      - ./docker/mongo/entrypoint.sh:/opt/mongo-entrypoint.sh:ro
      - ./docker/mongo/01-create-app-user.js:/docker-entrypoint-initdb.d/10-create-app-user.js:ro
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.adminCommand({ping:1}).ok' >/dev/null"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 10s
    stop_grace_period: 30s

volumes:
  gurach_dev_mongodb_data:
